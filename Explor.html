<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-5">

    <div class="flex gap-6">

        <aside class="w-64 bg-white rounded-3xl p-5 min-h-[500px]">

            <input id="search" type="text" placeholder="Search" class="w-full border rounded-xl p-3 mb-4">

            <select id="brand" class="w-full border rounded-xl p-3">
                <option value="">All Brands</option>
                <option value="Apple">Apple</option>
                <option value="Samsung">Samsung</option>
                <option value="Xiaomi">Xiaomi</option>
            </select>

        </aside>


        <main class="flex-1">


            <div class="flex gap-3 mb-6 flex-wrap">

                <button class="category px-4 py-2 rounded-full bg-white border" data-category="">
                    All
                </button>

                <button class="category px-4 py-2 rounded-full bg-white border" data-category="Organic">
                    Organic
                </button>

                <button class="category px-4 py-2 rounded-full bg-white border" data-category="Vegetables">
                    Vegetables
                </button>

                <button class="category px-4 py-2 rounded-full bg-white border" data-category="Fruits">
                    Fruits
                </button>
                <button class="category px-4 py-2 rounded-full bg-white border" data-category="under20">
                    Under $20
                </button>

                <button class="category px-4 py-2 rounded-full bg-white border" data-category="popular">
                    Popular
                </button>

            </div>


            <div id="products" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            </div>


            <div id="pagination" class="flex justify-center gap-2 mt-8 flex-wrap">
            </div>

        </main>

    </div>

    <script src="./Explor.js"></script>

</body>

</html>
